# Merge into the primary's shared ~/openpak/deploy/traefik/dynamic.yml. The gateway forwards
# Live service 6 here.
http:
  routers:
    x360-xmatch-web:
      entryPoints: [web]
      rule: PathPrefix(`/xmatch`)
      priority: 40
      service: x360-xmatch-http
  services:
    x360-xmatch-http:
      loadBalancer:
        servers:
        - url: http://openpak-x360-xmatch:10006
